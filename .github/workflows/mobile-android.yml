name: AstroOrbi Android preview

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'shared/**'
      - 'client/public/tarot/**'
      - 'client/public/brand/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - name: Prepare the native project
        working-directory: mobile
        run: |
          npm ci
          npm run build
          npx --no-install cap add android
          npm run prepare:android
          sed -i "s|mavenCentral()|maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }|g"             android/build.gradle node_modules/@capacitor/android/capacitor/build.gradle
      - name: Build and verify the APK
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon assembleDebug assembleDesign
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          design_apk=app/build/outputs/apk/design/app-design.apk
          "$build_tools/apksigner" verify "$design_apk"
          "$build_tools/aapt" dump badging "$design_apk" > "$RUNNER_TEMP/orbi-design-badging.txt"
          grep -F "package: name='app.astroorbi.preview.design'" "$RUNNER_TEMP/orbi-design-badging.txt"
          grep -F "application-label:'AstroOrbi Дизайн'" "$RUNNER_TEMP/orbi-design-badging.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: astroorbi-android-preview
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: astroorbi-design-preview
          path: mobile/android/app/build/outputs/apk/design/app-design.apk
          if-no-files-found: error
      - name: Check mobile screens and reading interactions
        run: |
          python3 -m venv "$RUNNER_TEMP/orbi-browser"
          "$RUNNER_TEMP/orbi-browser/bin/pip" -q install playwright==1.56.0
          "$RUNNER_TEMP/orbi-browser/bin/python" mobile/scripts/check-layout.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: astroorbi-mobile-screens
          path: mobile/layout-preview/*.png
          if-no-files-found: warn
